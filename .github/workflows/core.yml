name: Build PPSSPP core
on:
  workflow_dispatch:
  push:
    paths:
      - 'core/**'
      - '.github/workflows/core.yml'
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clone PPSSPP 1.20.4
        run: git clone --branch v1.20.4 --recurse-submodules --shallow-submodules https://github.com/hrydgard/ppsspp.git ppsspp
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '17'
      - name: Show layout
        run: ls ppsspp && ls ppsspp/android
      - name: Patch (app id, launcher screen)
        run: python3 core/patch.py ppsspp
      - name: Build
        working-directory: ppsspp
        run: bash ./gradlew assembleNormalOptimized --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: NarutoCore-apk
          path: ppsspp/android/build/outputs/apk/**/*.apk
